apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-qwen-30b-gpu
  labels:
    app: ollama-qwen-30b-gpu
spec:
  replicas: 4
  selector:
    matchLabels:
      app: ollama-qwen-30b-gpu
  template:
    metadata:
      labels:
        app: ollama-qwen-30b-gpu
    spec:
      restartPolicy: Always
      containers:
        - name: ollama-qwen-30b-gpu
          # Using the official image since the specific model image doesn't exist
          image: ollama/ollama:latest
          ports:
            - containerPort: 8000
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:8000"
          resources:
            limits:
              nvidia.com/gpu: 1  # Each pod takes 1 Blackwell card
          # Software engineer fix: start server, pull model, then keep process alive
          command: ["/bin/sh", "-c"]
          args:
            - |
              ollama serve &
              sleep 10;
              ollama pull qwen2.5:32b;
              wait
