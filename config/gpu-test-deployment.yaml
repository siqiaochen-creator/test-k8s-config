apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackwell-gpu-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blackwell-gpu-test
  template:
    metadata:
      labels:
        app: blackwell-gpu-test
    spec:
      restartPolicy: Always
      containers:
      - name: cuda-container
        image: nvidia/cuda:12.3.1-base-ubuntu22.04
        command: ["sh", "-c", "nvidia-smi && sleep 3600"]
        resources:
          limits:
            nvidia.com/gpu: 2
